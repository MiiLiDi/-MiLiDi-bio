<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml"><link rel="shortcut icon" href="../favicon.svg?v=2" type="image/svg+xml"><title>MiLiDi — Brawl Stars</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../enhancements.css"><style>
#brawl-intro{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:rgba(2,5,12,.88);backdrop-filter:blur(5px);transition:opacity .45s ease,visibility .45s ease}#brawl-intro.hide{opacity:0;visibility:hidden;pointer-events:none}.brawl-intro-box{position:relative;width:min(88vw,720px);height:min(58vh,460px);overflow:hidden;border-radius:24px;border:1px solid rgba(255,211,107,.35);box-shadow:0 20px 80px rgba(0,0,0,.7),0 0 45px rgba(255,185,55,.12);background:#080b12;animation:brawlBoxIn .5s ease-out both}.brawl-gif{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;animation:brawlGifIn 1.8s ease both}.brawl-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.25) 45%,rgba(0,0,0,.7))}.brawl-intro-title{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:clamp(25px,6vw,58px);font-weight:900;letter-spacing:.08em;color:#fff;white-space:nowrap;text-shadow:0 3px 22px #000,0 0 24px rgba(255,204,82,.55);animation:brawlTitle 1.8s ease both}.brawl-skip{position:absolute;right:14px;top:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;border-radius:999px;padding:7px 11px;font-size:11px;cursor:pointer;z-index:2}.brawl-loading{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);font-size:9px;color:rgba(255,255,255,.58);letter-spacing:.12em}@keyframes brawlBoxIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@keyframes brawlGifIn{from{opacity:0;transform:scale(1.08)}25%{opacity:1}to{transform:scale(1.02)}}@keyframes brawlTitle{0%,28%{opacity:0;transform:translate(-50%,10px) scale(.8)}48%{opacity:1;transform:translate(-50%,0) scale(1.04)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px) scale(1.08)}}@media(max-width:700px){.brawl-intro-box{width:92vw;height:52vh;border-radius:19px}.brawl-intro-title{font-size:28px}}
